# capa_supplygate - package manifest.
#
# SupplyGate is a supply-chain COMPLIANCE GATE for CI/CD. It reads three
# local inputs (a project's CycloneDX SBOM, an offline OSV vulnerability
# export, and the organisation's policy), decides PASS/FAIL for the build,
# and emits its OWN capability SBOM as a compiler-derived record of the
# authority it holds.
#
# One dependency, holding no capability of its own, resolved as a VERIFIED git
# dependency. `capa install` fetches it at its GPG-signed tag, verifies
# the tag signature against verify_key and its SLSA provenance, records
# the pinned commit in capa.lock, and vendors it under vendor/ (git-
# ignored):
#
#   capa_log - levelled logging over Stdio (the CI audit log lines).
#
# The dependency holds no authority of its own, so the SupplyGate
# capability surface stays what main.capa acquires: Fs and Stdio. The
# compiler's --manifest / --cyclonedx output records it: in particular no
# function holds Net.
# The verified supply chain is itself part of that story.

[package]
name = "capa_supplygate"
version = "0.1.0"
capa = ">=1.15.1"

[dependencies.capa_log]
git = "https://github.com/nelsonduarte/capa_log"
tag = "v0.1.2"
verify_key = "6C1D222D491FB88031E041A536CFB426101AA24B"
